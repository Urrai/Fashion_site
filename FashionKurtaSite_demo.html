<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FashionKurtas — Store</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,500&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ivory:#FBF7F1; --wine:#7A2438; --wine-dark:#4A1420; --gold:#C0924F;
    --gold-soft:#E4C79A; --blush:#EAD9C9; --ink:#2B2420; --ink-soft:#5C5148; --line:rgba(43,36,32,0.12);
    --green:#2E5E3E;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  body{background:var(--ivory);color:var(--ink);font-family:'Work Sans',sans-serif;line-height:1.5;}
  h1,h2,h3,.display{font-family:'Fraunces',serif;font-weight:500;color:var(--wine-dark);}
  a,button{font-family:inherit;}
  img{display:block;max-width:100%;}
  button{cursor:pointer;transition:background .15s ease,color .15s ease,border-color .15s ease,transform .08s ease;}
  button:active{transform:scale(0.97);}

  header{display:flex;align-items:center;justify-content:space-between;padding:18px 40px;border-bottom:1px solid var(--line);background:var(--ivory);position:sticky;top:0;z-index:20;}
  .logo{font-family:'Fraunces',serif;font-size:1.4rem;font-weight:600;color:var(--wine);cursor:pointer;}
  .logo span{color:var(--gold);}
  .header-actions{display:flex;gap:14px;align-items:center;}
  .icon-btn{background:none;border:1px solid var(--line);padding:9px 16px;font-size:0.85rem;font-weight:500;color:var(--ink);position:relative;}
  .icon-btn:hover{border-color:var(--wine);color:var(--wine);}
  .cart-count{background:var(--wine);color:#fff;border-radius:50%;width:18px;height:18px;font-size:0.66rem;display:inline-flex;align-items:center;justify-content:center;margin-left:6px;}

  main{max-width:1200px;margin:0 auto;padding:0 40px;}
  .section-head{display:flex;justify-content:space-between;align-items:flex-end;margin:40px 0 24px;flex-wrap:wrap;gap:16px;}
  .section-head h2{font-size:1.8rem;}

  .filters{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:26px;}
  .chip{padding:8px 18px;border:1px solid var(--line);border-radius:999px;font-size:0.83rem;background:#fff;color:var(--ink-soft);}
  .chip.active{border-color:var(--wine);color:var(--wine);background:var(--blush);}

  .product-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:26px 20px;padding-bottom:50px;}
  .product-card{display:flex;flex-direction:column;gap:8px;cursor:pointer;}
  .product-media{position:relative;aspect-ratio:3/4;overflow:hidden;background:var(--blush);display:flex;align-items:center;justify-content:center;}
  .product-media img{width:100%;height:100%;object-fit:cover;}
  .placeholder-ph{color:var(--wine-dark);opacity:0.4;font-size:0.8rem;text-align:center;padding:14px;}
  .product-name{font-size:0.92rem;font-weight:500;}
  .product-meta{display:flex;justify-content:space-between;align-items:center;font-size:0.85rem;color:var(--ink-soft);}
  .price{font-weight:600;color:var(--wine-dark);}
  .add-btn{margin-top:2px;background:var(--wine);color:#fff;border:none;padding:9px 0;font-size:0.8rem;font-weight:600;letter-spacing:.01em;}
  .add-btn:hover{background:var(--wine-dark);}
  .add-btn:active{background:var(--gold);}
  .card-remove-btn{position:absolute;top:8px;right:8px;width:26px;height:26px;border:none;border-radius:50%;background:rgba(255,255,255,0.9);color:var(--wine);font-size:0.8rem;display:flex;align-items:center;justify-content:center;box-shadow:0 1px 4px rgba(43,36,32,0.2);}
  .card-remove-btn:hover{background:var(--wine);color:#fff;}
  .empty-state{padding:60px 20px;text-align:center;color:var(--ink-soft);}

  /* Drawer / cart */
  .drawer-overlay{position:fixed;inset:0;background:rgba(43,36,32,0.4);z-index:40;display:none;}
  .drawer-overlay.open{display:block;}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(420px,100%);background:var(--ivory);z-index:41;transform:translateX(100%);transition:transform .25s ease;display:flex;flex-direction:column;}
  .drawer.open{transform:translateX(0);}
  .drawer-head{padding:22px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;}
  .drawer-close{background:none;border:none;font-size:1.3rem;color:var(--ink-soft);}
  .drawer-body{flex:1;overflow-y:auto;padding:18px 22px;}
  .cart-line{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--line);}
  .cart-line img{width:64px;height:80px;object-fit:cover;background:var(--blush);}
  .cart-line-info{flex:1;display:flex;flex-direction:column;gap:4px;}
  .cart-line-info .name{font-size:0.88rem;font-weight:500;}
  .cart-line-info .sub{font-size:0.78rem;color:var(--ink-soft);}
  .qty-row{display:flex;align-items:center;gap:8px;margin-top:4px;}
  .qty-btn{width:24px;height:24px;border:1px solid var(--line);background:#fff;font-size:0.85rem;}
  .remove-link{font-size:0.76rem;color:var(--wine);background:none;border:none;text-decoration:underline;margin-left:auto;}
  .drawer-foot{padding:20px 22px;border-top:1px solid var(--line);}
  .drawer-foot .total-row{display:flex;justify-content:space-between;font-size:1rem;font-weight:600;margin-bottom:14px;color:var(--wine-dark);}
  .btn-full{width:100%;padding:13px;background:var(--wine);color:#fff;border:none;font-size:0.9rem;font-weight:600;letter-spacing:.01em;}
  .btn-full:hover{background:var(--wine-dark);}
  .btn-full:active{background:var(--gold);}
  .btn-full:disabled{background:var(--line);color:var(--ink-soft);cursor:not-allowed;transform:none;}

  /* Checkout / views */
  .view{padding:40px 0 70px;max-width:640px;margin:0 auto;}
  .view h2{margin-bottom:22px;}
  .field{margin-bottom:16px;}
  .field label{display:block;font-size:0.8rem;font-weight:500;color:var(--ink-soft);margin-bottom:6px;}
  .field input, .field select, .field textarea{
    width:100%;padding:11px 12px;border:1px solid var(--line);background:#fff;font-size:0.9rem;font-family:inherit;color:var(--ink);
  }
  .field input:focus, .field select:focus, .field textarea:focus{outline:2px solid var(--wine);outline-offset:1px;}
  .field-row{display:flex;gap:12px;}
  .field-row .field{flex:1;}

  .pay-methods{display:flex;flex-direction:column;gap:10px;margin:18px 0 22px;}
  .pay-option{border:1px solid var(--line);padding:16px;cursor:pointer;display:flex;align-items:flex-start;gap:12px;}
  .pay-option.selected{border-color:var(--wine);background:#fff;box-shadow:0 0 0 1px var(--wine) inset;}
  .pay-option input{margin-top:3px;}
  .pay-option .pt{font-weight:600;font-size:0.9rem;}
  .pay-option .ps{font-size:0.8rem;color:var(--ink-soft);margin-top:2px;}
  .pay-option .badge{font-size:0.68rem;background:var(--blush);color:var(--wine-dark);padding:2px 7px;margin-left:8px;font-weight:600;}

  .upi-box{background:#fff;border:1px solid var(--line);padding:18px;margin-top:12px;}
  .upi-box p{font-size:0.83rem;color:var(--ink-soft);margin-bottom:10px;}
  .upi-link-btn{display:inline-block;background:var(--green);color:#fff;padding:11px 20px;font-size:0.88rem;font-weight:600;text-decoration:none;border:none;}

  .order-summary{background:#fff;border:1px solid var(--line);padding:18px;margin-bottom:20px;}
  .order-summary .row{display:flex;justify-content:space-between;font-size:0.86rem;padding:5px 0;}
  .order-summary .row.total{border-top:1px solid var(--line);margin-top:8px;padding-top:10px;font-weight:600;color:var(--wine-dark);}

  .confirm-box{text-align:center;padding:50px 20px;}
  .confirm-box .tick{font-size:2.4rem;color:var(--green);margin-bottom:14px;}
  .confirm-box h2{margin-bottom:8px;}
  .confirm-box p{color:var(--ink-soft);margin-bottom:24px;}
  .order-id{font-family:monospace;background:var(--blush);padding:4px 10px;font-size:0.85rem;}

  /* Admin */
  .admin-form{background:#fff;border:1px solid var(--line);padding:24px;margin-bottom:30px;}
  .upload-box{border:2px dashed var(--line);padding:24px;text-align:center;cursor:pointer;margin-bottom:16px;}
  .upload-box img{max-height:180px;margin:0 auto 10px;}
  .upload-box:hover{border-color:var(--wine);}
  .size-checks{display:flex;gap:8px;flex-wrap:wrap;}
  .size-check{border:1px solid var(--line);padding:6px 12px;font-size:0.8rem;cursor:pointer;}
  .size-check.active{border-color:var(--wine);background:var(--wine);color:#fff;}
  .admin-product-row{display:flex;align-items:center;gap:14px;padding:12px;border:1px solid var(--line);background:#fff;margin-bottom:10px;}
  .admin-product-row img{width:50px;height:64px;object-fit:cover;}
  .admin-product-row .info{flex:1;font-size:0.85rem;}
  .del-btn{background:none;border:1px solid var(--line);padding:6px 12px;font-size:0.78rem;color:var(--wine);}
  .toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--ivory);padding:12px 22px;font-size:0.85rem;z-index:60;opacity:0;transition:opacity .2s;pointer-events:none;}
  .toast.show{opacity:1;}

  .admin-toggle{font-size:0.78rem;color:var(--ink-soft);background:none;border:none;text-decoration:underline;}

  /* Add/remove confirmation popup */
  .modal-overlay{position:fixed;inset:0;background:rgba(43,36,32,0.45);z-index:70;display:none;align-items:center;justify-content:center;padding:20px;}
  .modal-overlay.open{display:flex;}
  .modal-box{background:var(--ivory);width:min(380px,100%);border:1px solid var(--line);box-shadow:0 12px 32px rgba(43,36,32,0.18);padding:22px;}
  .modal-head{display:flex;align-items:center;gap:10px;margin-bottom:14px;}
  .modal-icon{width:28px;height:28px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.95rem;color:#fff;flex-shrink:0;}
  .modal-icon.added{background:var(--green);}
  .modal-icon.removed{background:var(--wine);}
  .modal-title{font-family:'Fraunces',serif;font-size:1.05rem;color:var(--wine-dark);}
  .modal-product{display:flex;gap:12px;padding:12px;background:#fff;border:1px solid var(--line);margin-bottom:18px;}
  .modal-product img{width:56px;height:72px;object-fit:cover;background:var(--blush);}
  .modal-product .mp-info{flex:1;font-size:0.85rem;}
  .modal-product .mp-info .mp-name{font-weight:500;margin-bottom:3px;}
  .modal-product .mp-info .mp-sub{color:var(--ink-soft);font-size:0.78rem;}
  .modal-actions{display:flex;gap:10px;}
  .modal-actions button{flex:1;padding:11px;font-size:0.85rem;font-weight:600;border:1px solid var(--line);background:#fff;color:var(--ink);}
  .modal-actions .primary{background:var(--wine);color:#fff;border-color:var(--wine);}
  .modal-actions .primary:hover{background:var(--wine-dark);}
  .modal-actions .undo{color:var(--wine);}

  @media (max-width:900px){
    header{padding:16px 20px;}
    main{padding:0 20px;}
    .product-grid{grid-template-columns:repeat(2,1fr);}
    .field-row{flex-direction:column;gap:0;}
  }
</style>
</head>
<body>

<header>
  <div class="logo" onclick="goto('shop')">Fashion<span>Kurtas</span></div>
  <div class="header-actions">
    <button class="admin-toggle" onclick="handleAdminClick()">Seller / Admin</button>
    <button class="icon-btn" onclick="openCart()">Cart<span class="cart-count" id="cartCount">0</span></button>
  </div>
</header>

<main id="app-root"></main>

<div class="drawer-overlay" id="drawerOverlay" onclick="closeCart()"></div>
<div class="drawer" id="cartDrawer">
  <div class="drawer-head">
    <h3>Your bag</h3>
    <button class="drawer-close" onclick="closeCart()">✕</button>
  </div>
  <div class="drawer-body" id="cartBody"></div>
  <div class="drawer-foot" id="cartFoot"></div>
</div>

<div class="toast" id="toast"></div>

<div class="modal-overlay" id="actionModalOverlay" onclick="if(event.target===this)closeActionModal()">
  <div class="modal-box" id="actionModalBox"></div>
</div>

<script>
/* ---------------- State ---------------- */
let products = [];
let cart = []; // {productId, qty, size}
let currentView = 'shop';
let filterCategory = 'All';
let checkoutData = { name:'', phone:'', address:'', city:'', pincode:'', payment:'upi' };
let lastOrder = null;
let editingProduct = { name:'', price:'', category:'Ethnic Dress', sizes:[], image:null, stock:10, editId:null };
const MERCHANT_UPI = { vpa: 'fashionkurtas@upi', name: 'FashionKurtas' };
const ADMIN_PASSCODE = 'seller123'; // demo passcode — replace before going live
let isAdminMode = false;

/* ---------------- Storage helpers (plain browser localStorage — works fully offline / as a standalone file) ---------------- */
const STORE_PREFIX = 'fashionkurtas_';
function lsGet(key){
  try{
    const v = localStorage.getItem(STORE_PREFIX + key);
    return v ? JSON.parse(v) : null;
  }catch(e){ return null; }
}
function lsSet(key, value){
  try{
    localStorage.setItem(STORE_PREFIX + key, JSON.stringify(value));
  }catch(e){ console.error('Could not save', key, e); }
}
function loadProducts(){
  products = lsGet('products') || [];
}
function saveProducts(){
  lsSet('products', products);
}
function loadCart(){
  cart = lsGet('cart') || [];
}
function loadAdminMode(){
  isAdminMode = lsGet('isAdminMode') || false;
}
function saveAdminMode(){
  lsSet('isAdminMode', isAdminMode);
}
function saveCart(){
  lsSet('cart', cart);
}
function saveOrder(order){
  const orders = lsGet('orders') || [];
  orders.unshift(order);
  lsSet('orders', orders);
}
function loadOrders(){
  return lsGet('orders') || [];
}

/* ---------------- Utils ---------------- */
function fmt(n){ return '₹' + Number(n).toLocaleString('en-IN'); }
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 1800);
}
function genId(prefix){ return prefix + '-' + Math.random().toString(36).slice(2,8).toUpperCase(); }

/* ---------------- Add/remove confirmation popup ---------------- */
function openActionModal(kind, product, size, extraLine){
  const overlay = document.getElementById('actionModalOverlay');
  const box = document.getElementById('actionModalBox');
  const isAdded = kind === 'added';
  box.innerHTML = `
    <div class="modal-head">
      <div class="modal-icon ${isAdded?'added':'removed'}">${isAdded ? '✓' : '−'}</div>
      <div class="modal-title">${isAdded ? 'Added to bag' : 'Removed from bag'}</div>
    </div>
    <div class="modal-product">
      <img src="${product.image||''}" alt="${product.name}">
      <div class="mp-info">
        <div class="mp-name">${product.name}</div>
        <div class="mp-sub">${size ? 'Size '+size+' · ' : ''}${fmt(product.price)}${extraLine?(' · '+extraLine):''}</div>
      </div>
    </div>
    <div class="modal-actions">
      <button onclick="closeActionModal()">Continue shopping</button>
      ${isAdded
        ? `<button class="primary" onclick="closeActionModal();closeCart();goto('checkout')">Go to checkout</button>`
        : `<button class="primary" onclick="closeActionModal()">Okay</button>`}
    </div>
  `;
  overlay.classList.add('open');
}
function closeActionModal(){
  document.getElementById('actionModalOverlay').classList.remove('open');
}

/* ---------------- Admin login gate ---------------- */
function handleAdminClick(){
  if(isAdminMode){ goto('admin'); return; }
  const overlay = document.getElementById('actionModalOverlay');
  const box = document.getElementById('actionModalBox');
  box.innerHTML = `
    <div class="modal-head">
      <div class="modal-icon added">🔒</div>
      <div class="modal-title">Seller login</div>
    </div>
    <p style="font-size:0.83rem;color:var(--ink-soft);margin-bottom:14px;">Enter the seller passcode to manage products and view orders. Customers browsing the shop won't see this.</p>
    <div class="field"><input id="admin_pass_input" type="password" placeholder="Passcode" onkeydown="if(event.key==='Enter')submitAdminLogin()"></div>
    <div class="modal-actions" style="margin-top:14px;">
      <button onclick="closeActionModal()">Cancel</button>
      <button class="primary" onclick="submitAdminLogin()">Log in</button>
    </div>
  `;
  overlay.classList.add('open');
  setTimeout(()=>{ const el=document.getElementById('admin_pass_input'); if(el) el.focus(); }, 50);
}
function submitAdminLogin(){
  const val = document.getElementById('admin_pass_input').value;
  if(val === ADMIN_PASSCODE){
    isAdminMode = true;
    closeActionModal();
    goto('admin');
    saveAdminMode();
  } else {
    showToast('Incorrect passcode');
  }
}
function adminLogout(){
  isAdminMode = false;
  goto('shop');
  showToast('Logged out of seller mode');
  saveAdminMode();
}

function cartTotal(){
  return cart.reduce((sum,line)=>{
    const p = products.find(p=>p.id===line.productId);
    return sum + (p ? p.price*line.qty : 0);
  },0);
}
function cartCount(){
  return cart.reduce((s,l)=>s+l.qty,0);
}
function updateCartBadge(){
  document.getElementById('cartCount').textContent = cartCount();
}

/* ---------------- Router ---------------- */
function goto(view){
  currentView = view;
  render();
  window.scrollTo(0,0);
}

/* ---------------- Cart actions ---------------- */
function addToCart(productId, size){
  const p = products.find(x=>x.id===productId);
  if(!p) return;
  const useSize = size || (p.sizes && p.sizes[0]) || 'Free';
  const existing = cart.find(l=>l.productId===productId && l.size===useSize);
  if(existing){ existing.qty += 1; }
  else { cart.push({productId, size:useSize, qty:1}); }
  updateCartBadge();
  renderCartDrawer();
  openActionModal('added', p, useSize);
  saveCart(); // persists in the background, doesn't block the UI
}
function changeQty(idx, delta){
  const line = cart[idx];
  const p = products.find(x=>x.id===line.productId);
  cart[idx].qty += delta;
  const removed = cart[idx].qty <= 0;
  if(removed) cart.splice(idx,1);
  updateCartBadge();
  renderCartDrawer();
  if(currentView==='checkout') render();
  if(removed && p) openActionModal('removed', p, line.size);
  saveCart();
}
function removeLine(idx){
  const line = cart[idx];
  const p = products.find(x=>x.id===line.productId);
  cart.splice(idx,1);
  updateCartBadge();
  renderCartDrawer();
  if(p) openActionModal('removed', p, line.size);
  saveCart();
}
function openCart(){
  document.getElementById('drawerOverlay').classList.add('open');
  document.getElementById('cartDrawer').classList.add('open');
  renderCartDrawer();
}
function closeCart(){
  document.getElementById('drawerOverlay').classList.remove('open');
  document.getElementById('cartDrawer').classList.remove('open');
}
function renderCartDrawer(){
  const body = document.getElementById('cartBody');
  const foot = document.getElementById('cartFoot');
  if(cart.length===0){
    body.innerHTML = '<div class="empty-state">Your bag is empty.</div>';
    foot.innerHTML = '';
    return;
  }
  body.innerHTML = cart.map((line,idx)=>{
    const p = products.find(x=>x.id===line.productId);
    if(!p) return '';
    return `
      <div class="cart-line">
        <img src="${p.image||''}" alt="${p.name}">
        <div class="cart-line-info">
          <div class="name">${p.name}</div>
          <div class="sub">Size ${line.size} · ${fmt(p.price)}</div>
          <div class="qty-row">
            <button class="qty-btn" onclick="changeQty(${idx},-1)">−</button>
            <span>${line.qty}</span>
            <button class="qty-btn" onclick="changeQty(${idx},1)">+</button>
            <button class="remove-link" onclick="removeLine(${idx})">Remove</button>
          </div>
        </div>
      </div>`;
  }).join('');
  foot.innerHTML = `
    <div class="total-row"><span>Total</span><span>${fmt(cartTotal())}</span></div>
    <button class="btn-full" onclick="closeCart();goto('checkout')">Checkout</button>
  `;
}

/* ---------------- Views ---------------- */
function renderShop(){
  const categories = ['All', ...new Set(products.map(p=>p.category))];
  const list = filterCategory==='All' ? products : products.filter(p=>p.category===filterCategory);
  return `
    <div class="section-head"><h2>Shop the collection</h2></div>
    <div class="filters">
      ${categories.map(c=>`<div class="chip ${c===filterCategory?'active':''}" onclick="filterCategory='${c.replace(/'/g,"\\'")}';render()">${c}</div>`).join('')}
    </div>
    ${list.length===0 ? `<div class="empty-state">No products yet. Go to <strong>Seller / Admin</strong> to upload your first product photo.</div>` : `
    <div class="product-grid">
      ${list.map(p=>`
        <div class="product-card">
          <div class="product-media" onclick="goto('detail-${p.id}')">
            ${p.image ? `<img src="${p.image}" alt="${p.name}">` : `<div class="placeholder-ph">No photo uploaded</div>`}
            ${isAdminMode ? `<button class="card-remove-btn" title="Remove from store" onclick="event.stopPropagation();quickDeleteProduct('${p.id}')">✕</button>` : ''}
          </div>
          <div class="product-name">${p.name}</div>
          <div class="product-meta"><span class="price">${fmt(p.price)}</span><span>${p.sizes.join(', ')}</span></div>
          <button class="add-btn" onclick="addToCart('${p.id}')">Add to bag</button>
        </div>
      `).join('')}
    </div>`}
  `;
}

function renderDetail(id){
  const p = products.find(x=>x.id===id);
  if(!p) return `<div class="empty-state">Product not found.</div>`;
  return `
    <div class="view" style="max-width:900px;">
      <button class="admin-toggle" onclick="goto('shop')">← Back to shop</button>
      <div style="display:grid;grid-template-columns:1fr 1fr;gap:40px;margin-top:20px;">
        <div class="product-media" style="aspect-ratio:3/4;">
          ${p.image ? `<img src="${p.image}" alt="${p.name}">` : `<div class="placeholder-ph">No photo uploaded</div>`}
        </div>
        <div>
          <h2>${p.name}</h2>
          <p class="price" style="font-size:1.3rem;margin:10px 0 18px;">${fmt(p.price)}</p>
          <div class="field">
            <label>Size</label>
            <select id="detailSize">
              ${p.sizes.map(s=>`<option value="${s}">${s}</option>`).join('')}
            </select>
          </div>
          <button class="btn-full" style="margin-top:10px;" onclick="addToCart('${p.id}', document.getElementById('detailSize').value)">Add to bag</button>
        </div>
      </div>
    </div>
  `;
}

function renderCheckout(){
  if(cart.length===0){
    return `<div class="view"><div class="empty-state">Your bag is empty. <br><br><button class="btn-full" style="width:auto;padding:11px 22px;" onclick="goto('shop')">Continue shopping</button></div></div>`;
  }
  const total = cartTotal();
  const upiAmount = total.toFixed(2);
  const upiUri = `upi://pay?pa=${encodeURIComponent(MERCHANT_UPI.vpa)}&pn=${encodeURIComponent(MERCHANT_UPI.name)}&am=${upiAmount}&cu=INR&tn=${encodeURIComponent('Order payment')}`;
  return `
    <div class="view">
      <h2>Checkout</h2>
      <div class="order-summary">
        ${cart.map(line=>{
          const p = products.find(x=>x.id===line.productId);
          if(!p) return '';
          return `<div class="row"><span>${p.name} (${line.size}) × ${line.qty}</span><span>${fmt(p.price*line.qty)}</span></div>`;
        }).join('')}
        <div class="row total"><span>Total</span><span>${fmt(total)}</span></div>
      </div>

      <div class="field"><label>Full name</label><input id="cf_name" value="${checkoutData.name}" placeholder="Your name"></div>
      <div class="field"><label>Phone number</label><input id="cf_phone" value="${checkoutData.phone}" placeholder="10-digit mobile number"></div>
      <div class="field"><label>Delivery address</label><textarea id="cf_address" rows="2" placeholder="House no, street, area">${checkoutData.address}</textarea></div>
      <div class="field-row">
        <div class="field"><label>City</label><input id="cf_city" value="${checkoutData.city}" placeholder="City"></div>
        <div class="field"><label>Pincode</label><input id="cf_pincode" value="${checkoutData.pincode}" placeholder="6-digit pincode"></div>
      </div>

      <h3 style="font-size:1.1rem;margin-top:24px;margin-bottom:4px;">Payment method</h3>
      <div class="pay-methods">
        <label class="pay-option ${checkoutData.payment==='upi'?'selected':''}" onclick="selectPayment('upi')">
          <input type="radio" name="pay" ${checkoutData.payment==='upi'?'checked':''}>
          <div><div class="pt">UPI <span class="badge">Recommended</span></div><div class="ps">Pay via GPay, PhonePe, Paytm or any UPI app</div></div>
        </label>
        <label class="pay-option ${checkoutData.payment==='cod'?'selected':''}" onclick="selectPayment('cod')">
          <input type="radio" name="pay" ${checkoutData.payment==='cod'?'checked':''}>
          <div><div class="pt">Cash on Delivery</div><div class="ps">Pay in cash when your order arrives</div></div>
        </label>
        <label class="pay-option ${checkoutData.payment==='card'?'selected':''}" onclick="selectPayment('card')" style="opacity:0.6;">
          <input type="radio" name="pay" ${checkoutData.payment==='card'?'checked':''}>
          <div><div class="pt">Card / Netbanking <span class="badge">Coming soon</span></div><div class="ps">Needs a payment gateway (Razorpay/PayU) — not yet connected</div></div>
        </label>
      </div>

      ${checkoutData.payment==='upi' ? `
        <div class="upi-box">
          <p>Tap to open your UPI app and pay <strong>${fmt(total)}</strong> to <strong>${MERCHANT_UPI.vpa}</strong>. After paying, come back and tap "I've paid — place order".</p>
          <a class="upi-link-btn" href="${upiUri}">Pay ${fmt(total)} with UPI app</a>
        </div>
      ` : ''}

      <button class="btn-full" style="margin-top:22px;" onclick="placeOrder()">
        ${checkoutData.payment==='upi' ? "I've paid — place order" : "Place order"}
      </button>
    </div>
  `;
}

function selectPayment(method){
  syncCheckoutFields();
  checkoutData.payment = method;
  render();
}
function syncCheckoutFields(){
  const g = id => document.getElementById(id);
  if(g('cf_name')) checkoutData.name = g('cf_name').value;
  if(g('cf_phone')) checkoutData.phone = g('cf_phone').value;
  if(g('cf_address')) checkoutData.address = g('cf_address').value;
  if(g('cf_city')) checkoutData.city = g('cf_city').value;
  if(g('cf_pincode')) checkoutData.pincode = g('cf_pincode').value;
}

async function placeOrder(){
  syncCheckoutFields();
  if(!checkoutData.name || !checkoutData.phone || !checkoutData.address || !checkoutData.city || !checkoutData.pincode){
    showToast('Please fill in all delivery details');
    return;
  }
  const order = {
    id: genId('ORD'),
    items: cart.map(line=>{
      const p = products.find(x=>x.id===line.productId);
      return { name: p?p.name:'Unknown', size: line.size, qty: line.qty, price: p?p.price:0 };
    }),
    total: cartTotal(),
    customer: {...checkoutData},
    payment: checkoutData.payment,
    status: checkoutData.payment==='cod' ? 'Pending — pay on delivery' : (checkoutData.payment==='upi' ? 'Pending — verify UPI payment received' : 'Pending'),
    placedAt: new Date().toISOString()
  };
  await saveOrder(order);
  lastOrder = order;
  cart = [];
  await saveCart();
  updateCartBadge();
  goto('confirmation');
}

function renderConfirmation(){
  if(!lastOrder) return `<div class="view"><div class="empty-state">No recent order. <br><br><button class="btn-full" style="width:auto;padding:11px 22px;" onclick="goto('shop')">Go to shop</button></div></div>`;
  return `
    <div class="view">
      <div class="confirm-box">
        <div class="tick">✓</div>
        <h2>Order placed</h2>
        <p>Order ID: <span class="order-id">${lastOrder.id}</span></p>
        <p style="margin-top:14px;">Total ${fmt(lastOrder.total)} — ${lastOrder.status}</p>
        <button class="btn-full" style="width:auto;padding:11px 22px;margin-top:10px;" onclick="goto('shop')">Continue shopping</button>
      </div>
    </div>
  `;
}

/* ---------------- Admin ---------------- */
function toggleSize(s){
  const i = editingProduct.sizes.indexOf(s);
  if(i>-1) editingProduct.sizes.splice(i,1);
  else editingProduct.sizes.push(s);
  renderAdminFormOnly();
}
function handleImageUpload(input){
  const file = input.files[0];
  if(!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    const img = new Image();
    img.onload = () => {
      const maxW = 800;
      const scale = Math.min(1, maxW / img.width);
      const canvas = document.createElement('canvas');
      canvas.width = img.width*scale;
      canvas.height = img.height*scale;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
      editingProduct.image = canvas.toDataURL('image/jpeg', 0.75);
      renderAdminFormOnly();
    };
    img.src = e.target.result;
  };
  reader.readAsDataURL(file);
}
function updateEditingField(field, value){
  editingProduct[field] = value;
}
async function saveNewProduct(){
  const name = document.getElementById('adm_name').value.trim();
  const price = parseFloat(document.getElementById('adm_price').value);
  const category = document.getElementById('adm_category').value;
  const stock = parseInt(document.getElementById('adm_stock').value) || 0;
  if(!name || !price || editingProduct.sizes.length===0 || !editingProduct.image){
    showToast('Add a photo, name, price and at least one size');
    return;
  }
  if(editingProduct.editId){
    const p = products.find(x=>x.id===editingProduct.editId);
    if(p){
      p.name = name; p.price = price; p.category = category; p.stock = stock;
      p.sizes = [...editingProduct.sizes]; p.image = editingProduct.image;
    }
    showToast('Product updated');
  } else {
    products.push({
      id: genId('P'),
      name, price, category, stock,
      sizes: [...editingProduct.sizes],
      image: editingProduct.image
    });
    showToast('Product added to store');
  }
  editingProduct = { name:'', price:'', category:'Ethnic Dress', sizes:[], image:null, stock:10, editId:null };
  render();
  saveProducts();
}
function editProduct(id){
  const p = products.find(x=>x.id===id);
  if(!p) return;
  editingProduct = { name:p.name, price:p.price, category:p.category, sizes:[...p.sizes], image:p.image, stock:p.stock, editId:p.id };
  renderAdminFormOnly();
  const formEl = document.querySelector('.admin-form');
  if(formEl) formEl.scrollIntoView({behavior:'smooth', block:'start'});
}
function cancelEditProduct(){
  editingProduct = { name:'', price:'', category:'Ethnic Dress', sizes:[], image:null, stock:10, editId:null };
  renderAdminFormOnly();
}
function deleteProduct(id){
  const p = products.find(x=>x.id===id);
  products = products.filter(x=>x.id!==id);
  render();
  if(p) openActionModal('removed', p, null, 'removed from store catalog');
  saveProducts();
}
function quickDeleteProduct(id){
  deleteProduct(id);
}
function renderAdminFormOnly(){
  const container = document.getElementById('admin-form-container');
  if(container) container.innerHTML = adminFormHtml();
}
function adminFormHtml(){
  const sizeOptions = ['S','M','L','XL','2XL','3XL','4XL'];
  return `
    <div class="upload-box" onclick="document.getElementById('adm_file').click()">
      ${editingProduct.image ? `<img src="${editingProduct.image}">` : ''}
      <div>${editingProduct.image ? 'Click to change photo' : 'Click to upload product photo'}</div>
      <input type="file" id="adm_file" accept="image/*" style="display:none" onchange="handleImageUpload(this)">
    </div>
    <div class="field"><label>Product name</label><input id="adm_name" placeholder="e.g. Rust hand block kurta" value="${editingProduct.name}" oninput="editingProduct.name=this.value"></div>
    <div class="field-row">
      <div class="field"><label>Price (₹)</label><input id="adm_price" type="number" placeholder="1950" value="${editingProduct.price}" oninput="editingProduct.price=this.value"></div>
      <div class="field"><label>Stock</label><input id="adm_stock" type="number" placeholder="10" value="${editingProduct.stock}" oninput="editingProduct.stock=this.value"></div>
    </div>
    <div class="field">
      <label>Category</label>
      <select id="adm_category" onchange="editingProduct.category=this.value">
        <option ${editingProduct.category==='Ethnic Dress'?'selected':''}>Ethnic Dress</option>
        <option ${editingProduct.category==='Casual Dress'?'selected':''}>Casual Dress</option>
        <option ${editingProduct.category==='Plus Size Dress'?'selected':''}>Plus Size Dress</option>
        <option ${editingProduct.category==='Mul Cotton'?'selected':''}>Mul Cotton</option>
      </select>
    </div>
    <div class="field">
      <label>Available sizes</label>
      <div class="size-checks">
        ${sizeOptions.map(s=>`<div class="size-check ${editingProduct.sizes.includes(s)?'active':''}" onclick="toggleSize('${s}')">${s}</div>`).join('')}
      </div>
    </div>
    <div style="display:flex;gap:10px;margin-top:10px;">
      <button class="btn-full" onclick="saveNewProduct()">${editingProduct.editId ? 'Save changes' : 'Add product to store'}</button>
      ${editingProduct.editId ? `<button class="admin-toggle" style="white-space:nowrap;" onclick="cancelEditProduct()">Cancel</button>` : ''}
    </div>
  `;
}
async function renderAdmin(){
  const orders = await loadOrders();
  return `
    <div class="view" style="max-width:760px;">
      <h2>Seller dashboard</h2>
      <p style="color:var(--ink-soft);font-size:0.88rem;margin-bottom:20px;">Upload product photos here — they'll appear in the shop instantly. Set your UPI ID once so checkout pays into your real account.</p>
      <button class="admin-toggle" style="margin-bottom:20px;" onclick="adminLogout()">Log out of seller mode</button>

      <div class="admin-form">
        <h3 style="font-size:1.05rem;margin-bottom:14px;">${editingProduct.editId ? 'Edit product' : 'Add a product'}</h3>
        <div id="admin-form-container">${adminFormHtml()}</div>
      </div>

      <div class="admin-form">
        <h3 style="font-size:1.05rem;margin-bottom:14px;">Your UPI ID</h3>
        <div class="field"><label>UPI VPA (e.g. yourshop@okhdfcbank)</label><input id="adm_upi" value="${MERCHANT_UPI.vpa}" oninput="MERCHANT_UPI.vpa=this.value"></div>
        <p style="font-size:0.78rem;color:var(--ink-soft);">This is the ID customers' UPI payments will be sent to at checkout. Replace the demo value with your client's real UPI ID before going live.</p>
      </div>

      <h3 style="font-size:1.05rem;margin:30px 0 14px;">Current products (${products.length})</h3>
      ${products.length===0 ? '<p style="color:var(--ink-soft);font-size:0.85rem;">No products yet.</p>' : products.map(p=>`
        <div class="admin-product-row">
          <img src="${p.image||''}">
          <div class="info">${p.name}<br><span style="color:var(--ink-soft);">${fmt(p.price)} · ${p.sizes.join(', ')} · stock ${p.stock}</span></div>
          <button class="admin-toggle" style="margin-right:10px;white-space:nowrap;" onclick="editProduct('${p.id}')">Edit</button>
          <button class="del-btn" onclick="deleteProduct('${p.id}')">Remove</button>
        </div>
      `).join('')}

      <h3 style="font-size:1.05rem;margin:30px 0 14px;">Recent orders (${orders.length})</h3>
      ${orders.length===0 ? '<p style="color:var(--ink-soft);font-size:0.85rem;">No orders yet.</p>' : orders.slice(0,10).map(o=>`
        <div class="admin-product-row" style="align-items:flex-start;">
          <div class="info">
            <strong>${o.id}</strong> — ${fmt(o.total)} — ${o.payment.toUpperCase()}<br>
            <span style="color:var(--ink-soft);">${o.customer.name}, ${o.customer.city} · ${o.status}</span>
          </div>
        </div>
      `).join('')}
    </div>
  `;
}

/* ---------------- Main render ---------------- */
async function render(){
  const root = document.getElementById('app-root');
  if(currentView === 'shop'){
    root.innerHTML = renderShop();
  } else if(currentView.startsWith('detail-')){
    root.innerHTML = renderDetail(currentView.replace('detail-',''));
  } else if(currentView === 'checkout'){
    root.innerHTML = renderCheckout();
  } else if(currentView === 'confirmation'){
    root.innerHTML = renderConfirmation();
  } else if(currentView === 'admin'){
    if(!isAdminMode){ handleAdminClick(); currentView='shop'; root.innerHTML = renderShop(); updateCartBadge(); return; }
    root.innerHTML = '<div class="view"><div class="empty-state">Loading dashboard…</div></div>';
    root.innerHTML = await renderAdmin();
  }
  updateCartBadge();
}

/* ---------------- Init ---------------- */
async function init(){
  document.getElementById('app-root').innerHTML = '<div class="empty-state">Loading store…</div>';
  await loadProducts();
  await loadCart();
  await loadAdminMode();
  if(products.length === 0){
    // seed a couple of demo items so the shop isn't empty on first load
    products = [
      { id: genId('P'), name:'Rust hand block kurta', price:1950, category:'Ethnic Dress', sizes:['S','M','L','XL'], stock:8, image:'https://images.unsplash.com/photo-1594736797933-d0501ba2fe65?w=500&q=80' },
      { id: genId('P'), name:'Sage mul cotton dress', price:1595, category:'Mul Cotton', sizes:['M','L','XL','2XL'], stock:12, image:'https://images.unsplash.com/photo-1583391733981-8498408ec6c4?w=500&q=80' },
      { id: genId('P'), name:'Beige embroidered co-ord', price:2250, category:'Plus Size Dress', sizes:['XL','2XL','3XL'], stock:6, image:'https://images.unsplash.com/photo-1551803091-e20673f15770?w=500&q=80' }
    ];
    await saveProducts();
  }
  render();
}
init();
</script>
